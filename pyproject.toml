[project]
name = "mslurm"
version = "0.1.0"
description = "Submit to and inspect several Slurm clusters from one machine over SSH."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "huterguier", email = "huterguier@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
keywords = ["slurm", "hpc", "ssh", "sbatch", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Distributed Computing",
]

[project.urls]
Repository = "https://github.com/huterguier/mslurm"
Issues = "https://github.com/huterguier/mslurm/issues"

[project.scripts]
mslurm = "mslurm.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
